[package]
name = "oka"
version = "0.1.0"
authors = ["Rogerio Araújo <rogerio.araujo@gmail.com>"]
edition = "2024"
repository = "https://github.com/ararog/oka"
homepage = "https://github.com/ararog/oka"
license = "MIT OR Apache-2.0"
rust-version = "1.86.0"

[lints.cargo]
unused_dependencies = "deny"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(tarpaulin)'] }

[package.metadata.docs.rs]
all-features = true

[features]
default = ["tokio"]
tokio = ["dep:tokio", "redis/tokio-comp"]
smol = []

[dependencies]
hex = "0.4"
moka = { version = "0.12", features = ["future"] }
redis = { version = "1", features = ["connection-manager"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
tokio = { version = "1", features = ["fs"], optional = true }
